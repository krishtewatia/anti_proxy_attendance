# ==============================================================================
# Anti-Proxy Attendance System - production stack (one host)
#
#   caddy  ->  frontend (nginx, static files)
#          ->  backend  ->  vision-service
#                       ->  MongoDB Atlas (outside this file)
#
# Differences from docker-compose.yml (development):
#   - Only Caddy publishes ports (80 and 443). The backend, the frontend
#     container and the vision service are reachable only on the internal
#     network.
#   - Images are pulled from a registry, never built here; no source is mounted.
#   - There is no database container: MONGODB_URL points at the hosted cluster,
#     and the backend refuses to start if it cannot reach it.
#   - Nothing has a default secret. Every secret must be supplied through the
#     environment (on AWS: read from SSM Parameter Store at boot).
#
# Required environment: SITE_ADDRESS, IMAGE_PREFIX, IMAGE_TAG, MONGODB_URL,
# JWT_SECRET_KEY, VISION_SERVICE_API_KEY, RECOGNITION_SIGNING_KEY.
# First start only: BOOTSTRAP_ADMIN_EMAIL, BOOTSTRAP_ADMIN_PASSWORD.
# See docs/deployment/production_stack.md.
# ==============================================================================

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ----------------------------------------------------------------------------
  # 1. Caddy: HTTPS and the only public entry point
  # ----------------------------------------------------------------------------
  caddy:
    <<: *hardening
    image: caddy:2.10-alpine
    cap_add:
      # Bind ports 80 and 443 inside the container.
      - NET_BIND_SERVICE
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to the public host name}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      # All interfaces by default. HTTP_BIND / HTTPS_BIND exist for the local
      # rehearsal, which binds to loopback on ports chosen by Docker.
      - "${HTTP_BIND:-80}:80"
      - "${HTTPS_BIND:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account: kept across restarts so a restart
      # does not request a new certificate.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
        # Fixed address: the backend trusts X-Forwarded-For from here only.
        ipv4_address: 172.28.0.10

  # ----------------------------------------------------------------------------
  # 2. FastAPI backend (internal only)
  # ----------------------------------------------------------------------------
  backend:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-backend:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      APP_ENV: production
      DEBUG: "false"
      MONGODB_URL: ${MONGODB_URL:?Set MONGODB_URL}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: "10000"
      # Never run on an in-memory database: fail at startup instead.
      REQUIRE_DATABASE: "true"
      DATABASE_NAME: ${DATABASE_NAME:-anti_proxy_attendance}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      VISION_SERVICE_API_KEY: ${VISION_SERVICE_API_KEY:?Set VISION_SERVICE_API_KEY}
      REQUIRE_CAMERA_AUTH: "true"
      RECOGNITION_SIGNING_KEY: ${RECOGNITION_SIGNING_KEY:?Set RECOGNITION_SIGNING_KEY}
      ALLOW_INSECURE_RECOGNITION_KEY: "false"
      LIVENESS_MODE: ${LIVENESS_MODE:-observe}
      VISION_SERVICE_URL: http://vision-service:8088
      # The page and the API share one origin, so only that origin is allowed.
      CORS_ALLOWED_ORIGINS: https://${SITE_ADDRESS}
      # Believe X-Forwarded-For from Caddy and from nobody else.
      TRUSTED_PROXY_IPS: 172.28.0.10
      DEMO_MODE: "false"
      UPLOADS_DIR: /data/uploads
      # Used only while no administrator exists; remove once the account is made.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      REGISTRATION_RATE_LIMIT_PER_MINUTE: ${REGISTRATION_RATE_LIMIT_PER_MINUTE:-5}
    volumes:
      - uploads_data:/data/uploads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  # ----------------------------------------------------------------------------
  # 3. Frontend: static files on unprivileged nginx (internal only)
  # ----------------------------------------------------------------------------
  frontend:
    <<: *hardening
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - internal

  # ----------------------------------------------------------------------------
  # 4. Vision service (internal only; reached by the backend)
  # ----------------------------------------------------------------------------
  vision-service:
    <<: *hardening
    image: ${IMAGE_PREFIX}-vision:${IMAGE_TAG}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
      VISION_SERVICE_API_KEY: ${VISION_SERVICE_API_KEY}
      RECOGNITION_SIMILARITY_THRESHOLD: ${RECOGNITION_SIMILARITY_THRESHOLD:-0.50}
      RECOGNITION_MIN_MARGIN: ${RECOGNITION_MIN_MARGIN:-0.15}
      RECOGNITION_SIGNING_KEY: ${RECOGNITION_SIGNING_KEY}
      ALLOW_INSECURE_RECOGNITION_KEY: "false"
      LIVENESS_MODE: ${LIVENESS_MODE:-observe}
      LIVENESS_THRESHOLD: ${LIVENESS_THRESHOLD:-0.5}
      INSIGHTFACE_HOME: /home/visionuser/.insightface
      OUTBOX_DIR: /app/data
    volumes:
      - model_cache:/home/visionuser/.insightface
      - vision_outbox:/app/data
    expose:
      - "8088"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s = socket.socket(); s.connect(('127.0.0.1', 8088)); s.close()\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal

volumes:
  caddy_data:
    name: anti_proxy_caddy_data
  caddy_config:
    name: anti_proxy_caddy_config
  model_cache:
    name: anti_proxy_model_cache
  vision_outbox:
    name: anti_proxy_vision_outbox
  uploads_data:
    name: anti_proxy_uploads

networks:
  internal:
    name: anti-proxy-internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
