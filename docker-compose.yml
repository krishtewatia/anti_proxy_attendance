# ==============================================================================
# Anti-Proxy Attendance System - Full Local Docker Compose Stack
# Multi-stage, non-root containers, healthchecks, role profiles, isolated networks.
#
# Profiles:
#   - default (dev):  MongoDB, FastAPI backend, React frontend
#   - demo:           MongoDB, FastAPI backend, React frontend, Vision Service
#   - rtsp-sim:       Simulated MediaMTX RTSP CCTV broadcast server
#
# Quickstart:
#   docker compose up -d                        # Start default dev stack
#   docker compose --profile demo up -d         # Start full demo stack with vision
#   docker compose --profile rtsp-sim up -d     # Start with RTSP simulator
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: anti-proxy-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-replace_with_secure_mongo_root_password}
      DATABASE_NAME: ${DATABASE_NAME:-anti_proxy_attendance}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-antiproxy_user}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-antiproxy_secure_password}
    volumes:
      - mongo_data:/data/db
      - ./docker/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      # Bound strictly to localhost to prevent external network exposure
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - anti-proxy-net

  # ----------------------------------------------------------------------------
  # 2. FastAPI Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anti-proxy-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
    environment:
      APP_NAME: ${APP_NAME:-Anti-Proxy Attendance System}
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      MONGODB_URL: mongodb://${MONGO_APP_USERNAME:-antiproxy_user}:${MONGO_APP_PASSWORD:-antiproxy_secure_password}@mongodb:27017/${DATABASE_NAME:-anti_proxy_attendance}?authSource=${DATABASE_NAME:-anti_proxy_attendance}
      DATABASE_NAME: ${DATABASE_NAME:-anti_proxy_attendance}
      EVENTS_COLLECTION: ${EVENTS_COLLECTION:-attendance_events}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace_with_a_secure_random_at_least_32_chars_secret_key_here}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      VISION_SERVICE_API_KEY: ${VISION_SERVICE_API_KEY:-replace_with_secure_random_vision_api_key_secret_here}
      REQUIRE_CAMERA_AUTH: ${REQUIRE_CAMERA_AUTH:-true}
      VISION_SERVICE_URL: ${VISION_SERVICE_URL:-http://vision-service:8088}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080}
      EVENTS_MAX_PAYLOAD_BYTES: ${EVENTS_MAX_PAYLOAD_BYTES:-65536}
      EVENTS_RATE_LIMIT_PER_MINUTE: ${EVENTS_RATE_LIMIT_PER_MINUTE:-600}
      EVENT_TIMESTAMP_VALIDATION_ENABLED: ${EVENT_TIMESTAMP_VALIDATION_ENABLED:-true}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_CAMERA_ID: ${DEMO_CAMERA_ID:-CAM_ROOM_101_DOOR}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - anti-proxy-net

  # ----------------------------------------------------------------------------
  # 3. React Frontend (Nginx Unprivileged SPA)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anti-proxy-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - anti-proxy-net

  # ----------------------------------------------------------------------------
  # 4. Computer Vision Service (Profile: demo)
  # ----------------------------------------------------------------------------
  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile
    container_name: anti-proxy-vision-service
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
      VISION_SERVICE_API_KEY: ${VISION_SERVICE_API_KEY:-replace_with_secure_random_vision_api_key_secret_here}
      CAMERA_ID: CAM_ROOM_101_DOOR
      ENABLE_CV: "true"
      ENABLE_DISPATCH: "true"
      RECOGNITION_SIMILARITY_THRESHOLD: ${RECOGNITION_SIMILARITY_THRESHOLD:-0.50}
      RECOGNITION_MIN_MARGIN: ${RECOGNITION_MIN_MARGIN:-0.15}
      WEBRTC_ACCESS_TOKEN: ${WEBRTC_ACCESS_TOKEN:-}
      INSIGHTFACE_HOME: /home/visionuser/.insightface
      OUTBOX_DIR: /app/data
    volumes:
      - ./vision-service/camera:/app/camera:ro
      - model_cache:/home/visionuser/.insightface
      - vision_outbox:/app/data
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s = socket.socket(); s.connect(('127.0.0.1', 8088)); s.close()\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - anti-proxy-net

  # ----------------------------------------------------------------------------
  # 5. RTSP CCTV Stream Simulator (Profile: rtsp-sim)
  # ----------------------------------------------------------------------------
  rtsp-sim:
    image: bluenviron/mediamtx:1.9.3
    container_name: anti-proxy-rtsp-sim
    profiles:
      - rtsp-sim
    restart: unless-stopped
    ports:
      - "8554:8554"
    networks:
      - anti-proxy-net

# ------------------------------------------------------------------------------
# Persistent Named Volumes
# ------------------------------------------------------------------------------
volumes:
  mongo_data:
    name: anti_proxy_mongo_data
  model_cache:
    name: anti_proxy_model_cache
  vision_outbox:
    name: anti_proxy_vision_outbox

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  anti-proxy-net:
    name: anti-proxy-network
    driver: bridge
