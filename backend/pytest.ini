[pytest]
markers =
    unit: Fast unit tests without external services or database
    integration: Needs seeded demo accounts and a running vision service; excluded in CI
    e2e: End-to-end multi-step workflow tests
    slow: Tests with long timeouts or intensive operations
    needs_models: Tests requiring neural network weights or vision models
testpaths = tests
addopts = -m "not slow and not needs_models"
