# Dependabot Configuration for Automated Dependency Updates
# cooldown: wait 7 days after a release before proposing it, so freshly
# published (possibly compromised) versions are not pulled in immediately.
# groups: minor and patch updates are combined into one PR per ecosystem;
# major updates are left ungrouped, so each one arrives as its own PR.
# Exception: the two pip entries group every update (see the note there).
version: 2
updates:
  # Python Backend Dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The requirements files use unpinned ranges (">=x"), so Dependabot has no
    # current version to compare against and cannot tell a minor update from a
    # major one. A group limited to minor/patch therefore matches nothing and
    # every package gets its own PR. Grouping all updates is the only way to
    # get one PR here; these PRs only raise the lower bound of each range.
    groups:
      backend-pip:
        patterns:
          - "*"

  # Python Vision Service Dependencies
  - package-ecosystem: "pip"
    directory: "/vision-service"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Same reason as the backend entry: unpinned ranges cannot be split into
    # minor/patch vs major, so all vision-service updates share one PR.
    groups:
      vision-pip:
        patterns:
          - "*"
    ignore:
      # aiortc requires av<18, so pip cannot resolve the requirements with a
      # newer av. Remove this once aiortc supports av 18 or later.
      - dependency-name: "av"
        versions:
          - ">=18"

  # React Frontend Dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      frontend-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript major upgrades are deferred until after the final demo;
      # they need a deliberate migration, not an automated bump.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # Type definitions must match the Node runtime. The frontend is built
      # with Node 22 (frontend/Dockerfile and CI), so newer majors are not
      # wanted. Raise this when the build image's Node version is raised.
      - dependency-name: "@types/node"
        versions:
          - ">=23"

  # Docker Base Images (backend, frontend and vision-service in one entry so
  # their minor and patch updates share a single PR)
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
      - "/vision-service"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions Workflow Updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
