name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Backend Service Unit & Integration Tests
  # ============================================================================
  backend-ci:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run Pytest Suite with Coverage
        env:
          APP_ENV: test
          MONGODB_URL: mongodb://localhost:27017
          DATABASE_NAME: test_anti_proxy
          JWT_SECRET_KEY: test_secret_key_at_least_32_characters_long_for_ci
          VISION_SERVICE_API_KEY: test_vision_api_key_ci_12345
          REQUIRE_CAMERA_AUTH: "true"
        run: |
          # Coverage gate: this threshold should only ever go up, never down.
          pytest -m "not integration and not slow and not needs_models" --cov=app --cov-fail-under=75 --cov-report=term-missing --cov-report=xml

  # ============================================================================
  # 2. Vision Service Fast Tests (Model-Free Suite)
  # ============================================================================
  vision-ci:
    name: Vision Service Fast Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./vision-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Native Media Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: vision-service/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt pytest

      - name: Run Fast Unit & Mock Tests
        run: |
          pytest tests/test_event_dispatcher.py \
                 tests/test_reliability_outbox.py \
                 tests/test_kinematic_anti_spoof.py \
                 tests/test_multi_camera_orchestration.py \
                 tests/test_rtsp_robustness.py \
                 -v

  # ============================================================================
  # 3. Frontend Lint, Typecheck, Build, and Tests
  # ============================================================================
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Codebase (Oxlint)
        run: npm run lint

      - name: Typecheck and Build Bundle
        run: npm run build

      - name: Run Frontend Offline Test Suites
        run: npm test
