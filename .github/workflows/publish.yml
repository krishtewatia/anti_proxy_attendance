name: Publish Images

# Builds the three service images from main and pushes them to GitHub Container
# Registry, but only after every required check has passed for that commit.
# The images hold no secrets, no student data and no face gallery.
# When a deployment exists, the same run then deploys them and checks the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Wait until the ten required checks have all passed for this commit
  # ============================================================================
  gate:
    name: Wait For Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: read
    steps:
      - name: Wait for the required checks on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          required=(
            "Backend Tests & Coverage"
            "Vision Service Fast Tests"
            "Frontend Lint & Build"
            "Secret Scanning (Gitleaks)"
            "Code Scanning (Semgrep)"
            "Python Security (Bandit & pip-audit)"
            "Node Security (npm audit)"
            "Container Scanning (Trivy) - backend"
            "Container Scanning (Trivy) - frontend"
            "Container Scanning (Trivy) - vision-service"
          )
          for attempt in $(seq 1 80); do
            gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | [.name, (.conclusion // "pending")] | @tsv' > runs.tsv
            passed=0
            failed=""
            for name in "${required[@]}"; do
              # The newest run of a check is listed first.
              result=$(awk -F '\t' -v n="$name" '$1 == n { print $2; exit }' runs.tsv)
              case "$result" in
                success) passed=$((passed + 1)) ;;
                ""|pending) ;;
                *) failed="$failed [$name: $result]" ;;
              esac
            done
            if [ -n "$failed" ]; then
              echo "Not publishing: a required check did not pass:$failed"
              exit 1
            fi
            if [ "$passed" -eq "${#required[@]}" ]; then
              echo "All ${#required[@]} required checks passed for $SHA."
              exit 0
            fi
            echo "Attempt $attempt: $passed of ${#required[@]} required checks have passed; waiting."
            sleep 30
          done
          echo "Not publishing: the required checks did not finish in time."
          exit 1

  # ============================================================================
  # 2. Build and push one image per service
  # ============================================================================
  publish:
    name: Publish ${{ matrix.image }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - context: backend
            image: anti-proxy-backend
          - context: frontend
            image: anti-proxy-frontend
          - context: vision-service
            image: anti-proxy-vision
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Work out the image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: echo "ref=ghcr.io/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"

      # Tagged with the commit (what a deployment pins) and with "main".
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.name.outputs.ref }}:${{ github.sha }}
            ${{ steps.name.outputs.ref }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ============================================================================
  # 3. Deploy the new images, then check the site from outside
  #
  # Runs only when the deployment exists (repository variable
  # AWS_DEPLOY_ROLE_ARN is set). No AWS key is stored anywhere: the job proves
  # its identity to AWS with a short-lived GitHub token (OIDC), and the role it
  # receives can only run one fixed deploy command on the one instance.
  # ============================================================================
  deploy:
    name: Deploy And Check
    needs: publish
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      DEPLOY_DOCUMENT: ${{ vars.AWS_DEPLOY_DOCUMENT }}
      SITE_URL: ${{ vars.SITE_URL }}
      RELEASE: ${{ github.sha }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get short-lived AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-deploy-${{ github.run_id }}

      # In on-demand mode the instance is often stopped. That is not a failure:
      # it starts the release it was last given, and `make deploy` brings it
      # up to date.
      - name: Is the instance running?
        id: instance
        run: |
          state=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" != "running" ]; then
            echo "::notice::The instance is $state, so nothing was deployed. Run 'make deploy' after starting it."
          fi

      - name: Deploy this commit
        if: steps.instance.outputs.state == 'running'
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DEPLOY_DOCUMENT" \
            --parameters "ReleaseSha=$RELEASE" \
            --query 'Command.CommandId' --output text)
          for attempt in $(seq 1 90); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|TimedOut|Cancelled) break ;;
            esac
          done
          # The deploy script prints release ids and container states, never a secret.
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text | tail -n 40
          if [ "$status" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text | tail -n 40
            echo "Deploy ended with status: $status"
            exit 1
          fi

      # Needs no photos, no account and no secret, and creates nothing on the site.
      - name: Check the site from outside
        if: steps.instance.outputs.state == 'running'
        run: python3 scripts/smoke_e2e.py --base-url "$SITE_URL" --checks-only
