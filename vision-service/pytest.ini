[pytest]
pythonpath = .
# Only tests/ is collected: test_camera.py in the service root is a hardware
# diagnostic script, not a test.
testpaths = tests
markers =
    unit: Fast unit tests without models or external services
    integration: Integration tests between CV/pipeline components
    e2e: End-to-end integration tests connecting CV, Dispatcher, Backend and Database
    slow: Tests running full video benchmarks or long processing loops
    needs_models: Tests requiring ONNX models or heavy neural net inference
addopts = -m "not needs_models and not slow"
