# Cache-Control value for fingerprinted static assets; empty for all other URIs.
map $uri $static_cache_control {
    default "";
    # Proxied backend responses are never given the static-asset policy
    "~^/(api|uploads)/" "";
    "~*\.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-lived caching for static assets. Set at server level (value comes
    # from the map above and is empty for everything else, which omits the
    # header) so no location block redefines add_header and silently drops
    # the security headers.
    add_header Cache-Control $static_cache_control;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Reverse proxy for backend API
    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        # The API is plain HTTP with no WebSockets. Upgrade/Connection are
        # deliberately not set here: nginx then drops those hop-by-hop headers
        # instead of forwarding them, which blocks h2c request smuggling.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Reverse proxy for backend uploads
    location ^~ /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Reverse proxy for backend health check
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend Single Page Application (SPA) routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
